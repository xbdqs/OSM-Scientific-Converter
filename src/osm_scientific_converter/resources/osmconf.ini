[general]
# GDAL >= 3.10 is required because this configuration uses [general].
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform,area=yes,waterway=riverbank,power=plant,power=substation,power=generator,power=transformer,power=switchgear,power=converter,power=compensator,man_made=storage_tank,man_made=gasometer,man_made=water_works,man_made=wastewater_plant
