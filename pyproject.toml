[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-scientific-converter"
version = "0.4.2"
description = "Auditable OSM scientific converter with a PySide6 desktop workflow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Qingsong Du"},
    {name = "Guoyu Li"},
    {name = "Fei Wang"},
    {name = "Wei Ma"},
    {name = "Yanhu Mu"},
]
dependencies = ["psutil>=5.9", "PySide6==6.8.3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4,<5"]
package = ["pyinstaller>=6.10,<7"]

[project.scripts]
osm-sci = "osm_scientific_converter.cli.main:main"
osm-sci-gui = "osm_scientific_converter.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_scientific_converter = ["resources/*.ini", "resources/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
